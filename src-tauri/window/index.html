<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>夏奈儿</title>
    <style>
      :root {
        color-scheme: dark;
        --cyber-glow: 190 98% 68%;
        --cyber-glow-soft: 200 90% 58%;
        --cyber-violet: 260 90% 68%;
        --cyber-magenta: 285 95% 66%;
        --cyber-danger: 4 90% 64%;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Microsoft YaHei", sans-serif;
        /* 深空背景：HUD 网格 + 顶部青光 + 角落紫光 */
        background-color: hsl(215 32% 6.5%);
        background-image:
          linear-gradient(hsl(var(--cyber-glow) / 0.025) 1px, transparent 1px),
          linear-gradient(90deg, hsl(var(--cyber-glow) / 0.025) 1px, transparent 1px),
          radial-gradient(
            ellipse 70% 45% at 50% -8%,
            hsl(var(--cyber-glow) / 0.12),
            transparent 60%
          ),
          radial-gradient(
            ellipse 40% 30% at 100% 100%,
            hsl(var(--cyber-violet) / 0.1),
            transparent 55%
          );
        background-size: 38px 38px, 38px 38px, 100% 100%, 100% 100%;
        background-attachment: fixed;
        color: #e2e8f0;
        overflow: hidden;
        user-select: none;
        cursor: default;
      }
      /* 无边框窗口的拖拽层：铺在整个视口底层，内容卡片与按钮盖在其上。
         加载/错误页没有 WebUI 的自定义标题栏，没有它窗口完全无法拖动。 */
      .drag-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
      }
      /* 右上角退出按钮：无边框窗口没有原生 X，加载卡死/出错时用户需要退路。
         走 process.exit → RunEvent::ExitRequested → 壳杀掉 sidecar，不留孤儿进程。 */
      .win-close {
        position: fixed;
        top: 0;
        right: 0;
        z-index: 3;
        width: 40px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        color: #475569;
        background: transparent;
        border: none;
        cursor: pointer;
        transition: color 0.15s, background 0.15s;
      }
      .win-close:hover {
        color: #fff;
        background: rgb(239 68 68 / 0.85);
      }
      .win-close svg {
        width: 12px;
        height: 12px;
      }
      .app {
        position: relative;
        z-index: 1;
        text-align: center;
        padding: 2rem;
      }
      /* 旋转的光环装饰 */
      .orb-wrap {
        position: relative;
        width: 96px;
        height: 96px;
        margin: 0 auto 1.25rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* 机器人 logo：透明底 PNG，与 exe 图标 / WebUI 头部 logo 同一张图。
         机器人胸口的青紫光环本身已和闪屏渐变同色系，这里只叠一层外发光
         把它融进霓虹背景（用 filter 而非 box-shadow —— 贴图不吃 box-shadow）。 */
      .logo {
        position: relative;
        z-index: 2;
        width: 76px;
        height: 76px;
        object-fit: contain;
        filter: drop-shadow(0 0 10px hsl(var(--cyber-glow) / 0.45))
          drop-shadow(0 0 24px hsl(var(--cyber-violet) / 0.3));
        animation: orb-pulse 3.6s ease-in-out infinite;
      }
      .ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        pointer-events: none;
      }
      .ring-1 {
        border: 1px solid hsl(var(--cyber-glow) / 0.35);
        animation: ring-spin 8s linear infinite;
      }
      .ring-1::before {
        content: "";
        position: absolute;
        top: -2px;
        left: 50%;
        width: 4px;
        height: 4px;
        transform: translateX(-50%);
        border-radius: 50%;
        background: hsl(var(--cyber-glow));
        box-shadow: 0 0 8px hsl(var(--cyber-glow) / 0.9);
      }
      .ring-2 {
        inset: -10px;
        border: 1px dashed hsl(var(--cyber-violet) / 0.3);
        animation: ring-spin 14s linear infinite reverse;
      }
      @keyframes orb-pulse {
        0%,
        100% {
          transform: scale(1);
          filter: drop-shadow(0 0 10px hsl(var(--cyber-glow) / 0.45))
            drop-shadow(0 0 24px hsl(var(--cyber-violet) / 0.3));
        }
        50% {
          transform: scale(1.04);
          filter: drop-shadow(0 0 14px hsl(var(--cyber-glow) / 0.65))
            drop-shadow(0 0 36px hsl(var(--cyber-violet) / 0.42));
        }
      }
      @keyframes ring-spin {
        to {
          transform: rotate(360deg);
        }
      }
      h1 {
        font-size: 1.35rem;
        font-weight: 700;
        margin: 0 0 0.5rem;
        letter-spacing: 0.04em;
        color: hsl(var(--cyber-glow));
        text-shadow:
          0 0 10px hsl(var(--cyber-glow) / 0.5),
          0 0 22px hsl(var(--cyber-glow-soft) / 0.3);
      }
      p {
        margin: 0;
        font-size: 0.85rem;
        letter-spacing: 0.06em;
        color: #94a3b8;
      }
      /* 扫描线加载条 */
      .loader {
        position: relative;
        width: 140px;
        height: 2px;
        margin: 1.5rem auto 0;
        background: rgb(148 163 184 / 0.18);
        border-radius: 999px;
        overflow: hidden;
      }
      .loader::before {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        background: linear-gradient(
          90deg,
          transparent,
          hsl(var(--cyber-glow)),
          transparent
        );
        border-radius: 999px;
        box-shadow: 0 0 10px hsl(var(--cyber-glow) / 0.8);
        animation: loader-sweep 1.4s ease-in-out infinite;
      }
      @keyframes loader-sweep {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }
      /* 错误态：光环变红并停转，隐藏加载条，露出重试/退出按钮 */
      .error .loader {
        display: none;
      }
      .error p {
        color: #fca5a5;
      }
      .error .logo {
        animation: none;
        filter: grayscale(0.35) drop-shadow(0 0 12px hsl(var(--cyber-danger) / 0.45));
      }
      .error .ring-1 {
        border-color: hsl(var(--cyber-danger) / 0.5);
        animation: none;
      }
      .error .ring-1::before {
        background: hsl(var(--cyber-danger));
        box-shadow: 0 0 8px hsl(var(--cyber-danger) / 0.9);
      }
      .error .ring-2 {
        border-color: hsl(var(--cyber-danger) / 0.3);
        animation: none;
      }
      .error-actions {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
        margin-top: 1.5rem;
      }
      .error-actions[hidden] {
        display: none;
      }
      .btn {
        padding: 0.45rem 1.4rem;
        font-size: 0.8rem;
        font-family: inherit;
        letter-spacing: 0.08em;
        color: hsl(var(--cyber-glow));
        background: hsl(var(--cyber-glow) / 0.08);
        border: 1px solid hsl(var(--cyber-glow) / 0.35);
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.15s, box-shadow 0.15s;
      }
      .btn:hover {
        background: hsl(var(--cyber-glow) / 0.16);
        box-shadow: 0 0 12px hsl(var(--cyber-glow) / 0.35);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .btn-secondary {
        color: #94a3b8;
        background: transparent;
        border-color: rgb(148 163 184 / 0.3);
      }
      .btn-secondary:hover {
        background: rgb(148 163 184 / 0.1);
        box-shadow: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .logo,
        .ring-1,
        .ring-2,
        .loader::before {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="drag-bg" data-tauri-drag-region></div>
    <button class="win-close" id="close-btn" title="退出" aria-label="退出">
      <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M1 1l10 10M11 1L1 11" />
      </svg>
    </button>
    <div class="app" id="app">
      <div class="orb-wrap">
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <img class="logo" src="robot.png" alt="" draggable="false" />
      </div>
      <h1>夏奈儿</h1>
      <p id="status">正在启动…</p>
      <div class="loader"></div>
      <div class="error-actions" id="error-actions" hidden>
        <button class="btn" id="retry-btn" type="button">重试</button>
        <button class="btn btn-secondary" id="quit-btn" type="button">退出</button>
      </div>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);
      const status = document.getElementById("status");
      const actions = document.getElementById("error-actions");
      const isError = params.has("gateway_error") || params.has("gateway_stopped");
      if (isError) {
        document.body.classList.add("error");
        status.textContent = params.has("gateway_error")
          ? "启动失败，无法连接智能体服务。"
          : "服务已停止，请重试或退出。";
        actions.hidden = false;
      }

      // 浏览器直接打开此文件时 __TAURI__ 不存在，全部做可空调用兜底。
      const tauri = window.__TAURI__;
      const quit = () => tauri?.process?.exit(0);

      document.getElementById("close-btn").addEventListener("click", quit);
      document.getElementById("quit-btn").addEventListener("click", quit);
      document.getElementById("retry-btn").addEventListener("click", async (e) => {
        // 防连点：Rust 侧把窗口导航回加载页（整页刷新），失败后才会走到 catch。
        e.currentTarget.disabled = true;
        try {
          await tauri?.core?.invoke("retry_gateway");
        } catch {
          e.currentTarget.disabled = false;
        }
      });
    </script>
  </body>
</html>
