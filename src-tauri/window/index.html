<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>biscuitbot</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      .app {
        text-align: center;
        padding: 2rem;
      }
      .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 1rem;
        border-radius: 18px;
        background: linear-gradient(135deg, #f59e0b, #ea580c);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.2rem;
        font-weight: 800;
        color: #fff;
      }
      h1 {
        font-size: 1.35rem;
        font-weight: 700;
        margin: 0 0 0.5rem;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0;
        font-size: 0.95rem;
        color: #94a3b8;
      }
      .spinner {
        width: 22px;
        height: 22px;
        margin: 1.25rem auto 0;
        border: 3px solid rgba(148, 163, 184, 0.25);
        border-top-color: #f59e0b;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      .error .spinner {
        display: none;
      }
      .error p {
        color: #fca5a5;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="app" id="app">
      <div class="logo">🍪</div>
      <h1>biscuitbot</h1>
      <p id="status">正在启动…</p>
      <div class="spinner"></div>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);
      const status = document.getElementById("status");
      if (params.has("gateway_error")) {
        document.body.classList.add("error");
        status.textContent =
          "启动失败，无法连接智能体服务。请关闭应用后重试。";
      } else if (params.has("gateway_stopped")) {
        document.body.classList.add("error");
        status.textContent = "服务已停止，请关闭应用后重新打开。";
      }
    </script>
  </body>
</html>
