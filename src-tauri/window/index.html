<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>biscuitbot</title>
    <style>
      :root {
        color-scheme: dark;
        --cyber-glow: 190 98% 68%;
        --cyber-glow-soft: 200 90% 58%;
        --cyber-violet: 260 90% 68%;
        --cyber-magenta: 285 95% 66%;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Microsoft YaHei", sans-serif;
        /* 深空背景：HUD 网格 + 顶部青光 + 角落紫光 */
        background-color: hsl(215 32% 6.5%);
        background-image:
          linear-gradient(hsl(var(--cyber-glow) / 0.025) 1px, transparent 1px),
          linear-gradient(90deg, hsl(var(--cyber-glow) / 0.025) 1px, transparent 1px),
          radial-gradient(
            ellipse 70% 45% at 50% -8%,
            hsl(var(--cyber-glow) / 0.12),
            transparent 60%
          ),
          radial-gradient(
            ellipse 40% 30% at 100% 100%,
            hsl(var(--cyber-violet) / 0.1),
            transparent 55%
          );
        background-size: 38px 38px, 38px 38px, 100% 100%, 100% 100%;
        background-attachment: fixed;
        color: #e2e8f0;
        overflow: hidden;
      }
      .app {
        position: relative;
        text-align: center;
        padding: 2rem;
      }
      /* 旋转的光环装饰 */
      .orb-wrap {
        position: relative;
        width: 96px;
        height: 96px;
        margin: 0 auto 1.25rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .logo {
        position: relative;
        z-index: 2;
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: linear-gradient(135deg, hsl(190 98% 62%), hsl(260 90% 66%));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        font-weight: 800;
        color: #fff;
        box-shadow:
          0 0 24px hsl(var(--cyber-glow) / 0.55),
          0 0 48px hsl(var(--cyber-violet) / 0.25),
          inset 0 1px 0 rgb(255 255 255 / 0.25);
        animation: orb-pulse 3.6s ease-in-out infinite;
      }
      .ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        pointer-events: none;
      }
      .ring-1 {
        border: 1px solid hsl(var(--cyber-glow) / 0.35);
        animation: ring-spin 8s linear infinite;
      }
      .ring-1::before {
        content: "";
        position: absolute;
        top: -2px;
        left: 50%;
        width: 4px;
        height: 4px;
        transform: translateX(-50%);
        border-radius: 50%;
        background: hsl(var(--cyber-glow));
        box-shadow: 0 0 8px hsl(var(--cyber-glow) / 0.9);
      }
      .ring-2 {
        inset: -10px;
        border: 1px dashed hsl(var(--cyber-violet) / 0.3);
        animation: ring-spin 14s linear infinite reverse;
      }
      @keyframes orb-pulse {
        0%,
        100% {
          transform: scale(1);
          box-shadow:
            0 0 24px hsl(var(--cyber-glow) / 0.55),
            0 0 48px hsl(var(--cyber-violet) / 0.25),
            inset 0 1px 0 rgb(255 255 255 / 0.25);
        }
        50% {
          transform: scale(1.04);
          box-shadow:
            0 0 32px hsl(var(--cyber-glow) / 0.75),
            0 0 64px hsl(var(--cyber-violet) / 0.35),
            inset 0 1px 0 rgb(255 255 255 / 0.3);
        }
      }
      @keyframes ring-spin {
        to {
          transform: rotate(360deg);
        }
      }
      h1 {
        font-size: 1.35rem;
        font-weight: 700;
        margin: 0 0 0.5rem;
        letter-spacing: 0.04em;
        color: hsl(var(--cyber-glow));
        text-shadow:
          0 0 10px hsl(var(--cyber-glow) / 0.5),
          0 0 22px hsl(var(--cyber-glow-soft) / 0.3);
      }
      p {
        margin: 0;
        font-size: 0.85rem;
        letter-spacing: 0.06em;
        color: #94a3b8;
      }
      /* 扫描线加载条 */
      .loader {
        position: relative;
        width: 140px;
        height: 2px;
        margin: 1.5rem auto 0;
        background: rgb(148 163 184 / 0.18);
        border-radius: 999px;
        overflow: hidden;
      }
      .loader::before {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        background: linear-gradient(
          90deg,
          transparent,
          hsl(var(--cyber-glow)),
          transparent
        );
        border-radius: 999px;
        box-shadow: 0 0 10px hsl(var(--cyber-glow) / 0.8);
        animation: loader-sweep 1.4s ease-in-out infinite;
      }
      @keyframes loader-sweep {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }
      .error .loader {
        display: none;
      }
      .error p {
        color: #fca5a5;
      }
      @media (prefers-reduced-motion: reduce) {
        .logo,
        .ring-1,
        .ring-2,
        .loader::before {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="app" id="app">
      <div class="orb-wrap">
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="logo">🍪</div>
      </div>
      <h1>biscuitbot</h1>
      <p id="status">正在启动…</p>
      <div class="loader"></div>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);
      const status = document.getElementById("status");
      if (params.has("gateway_error")) {
        document.body.classList.add("error");
        status.textContent =
          "启动失败，无法连接智能体服务。请关闭应用后重试。";
      } else if (params.has("gateway_stopped")) {
        document.body.classList.add("error");
        status.textContent = "服务已停止，请关闭应用后重新打开。";
      }
    </script>
  </body>
</html>
