[package]
name = "biscuitbot"
version = "0.3.12"
description = "biscuitbot 濠电姷顣介崜婵嬨€冮崨瀛樺剹闁稿本鍑归悞浠嬫煟濡も偓閻楀繘鎮甸崜浣虹＜婵炴垶蓱鐠愶紕绱掗幇顓ф疁闁哄本绋戦～婵嬫偂鎼达絼鍝楀┑鐘愁問閸犳帡寮查悩宸殨妞ゆ洍鍋撻柟顔规櫇娴狅箓宕掑▎鎴犵厜 gateway sidecar 濠德板€楁慨鐑藉磻閻樻祴鏋栨繛鎴炵懄閸欏繘鏌ｉ幇顒傛憼濠殿喗绮撻弻锕€螣娓氼垱笑閻?WebUI"
authors = ["biscuitbot"]
edition = "2021"

[lib]
name = "biscuitbot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
