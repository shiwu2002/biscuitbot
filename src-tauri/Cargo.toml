[package]
name = "xianaibot"
version = "0.3.46"
description = "夏奈儿（XiaNaiBot）智能体桌面端：启动无头 gateway sidecar 并加载其 WebUI"
authors = ["xianaibot"]
edition = "2021"

[lib]
name = "xianaibot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
# single-instance: prevent duplicate shells & sidecars (see lib.rs)
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# sidecar 重启退避的 sleep 需要 tokio time（tauri 2 的 async_runtime 基于 tokio）
tokio = { version = "1", features = ["time"] }

[profile.release]
strip = true
# 发布产物体积与运行性能优化：LTO + 单代码生成单元 + panic 直接终止。
# 代价是发布编译变慢；增量开发用 dev profile 不受影响。
lto = true
codegen-units = 1
panic = "abort"
