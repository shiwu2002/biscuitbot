[package]
name = "biscuitbot"
version = "0.3.10"
description = "biscuitbot 濠碘剝顨呴惌鍌氼焽閻楀牏鐝剁紒娑樻贡缁愭鏌涘鐓庣仩濠殿喒鏅犲顕€鎮╃仦鍌欑矒 gateway sidecar 濡ょ姷鍋犲▔娑欐叏閻愬瓨濮滈柦妯侯槸瀵?WebUI"
authors = ["biscuitbot"]
edition = "2021"

[lib]
name = "biscuitbot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
