[package]
name = "xianaibot"
version = "0.3.43"
description = "夏奈儿（XiaNaiBot）智能体桌面端：启动无头 gateway sidecar 并加载其 WebUI"
authors = ["xianaibot"]
edition = "2021"

[lib]
name = "xianaibot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
# single-instance: prevent duplicate shells & sidecars (see lib.rs)
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 閻劋绨?sidecar respawn 閻ㄥ嫭瀵氶弫浼粹偓鈧柆?sleep閿涘湵auri 2 瀹歌弓绱堕柅鎺嶇贩鐠?tokio閿涘本妯夊蹇擄紣閺勫簼绗夋晶鐐插閺嬪嫬缂撻弮鍫曟？閿?
tokio = { version = "1", features = ["time"] }

[profile.release]
strip = true
